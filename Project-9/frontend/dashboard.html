<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card dashboard-card">
    <div class="topbar">
      <h1 id="greeting">Users</h1>
      <button onclick="logout()">Log out</button>
    </div>
    <div class="error" id="error"></div>
    <table id="usersTable">
      <thead>
        <tr><th>ID</th><th>Username</th><th>Joined</th></tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>

<script>
// Uses whatever host the page was loaded from (localhost, a LAN IP, etc.)
// instead of hardcoding "localhost", which only works when the browser
// and the containers are on the same machine.
const API_BASE = `http://${window.location.hostname}:5000`;
const token = localStorage.getItem('token');
const username = localStorage.getItem('username');

if (!token) {
  window.location.href = 'index.html';
}

document.getElementById('greeting').textContent = `Users (logged in as ${username})`;

async function loadUsers() {
  const errorEl = document.getElementById('error');
  try {
    // This is the request that proves the JWT works: user-service checks
    // it WITHOUT calling auth-service at all.
    const res = await fetch(`${API_BASE}/api/users`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (res.status === 401) {
      // Token missing/expired/invalid - user-service rejected it directly.
      localStorage.removeItem('token');
      window.location.href = 'index.html';
      return;
    }
    const users = await res.json();
    const body = document.getElementById('usersBody');
    body.innerHTML = '';
    users.forEach(u => {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${u.id}</td><td>${u.username}</td><td>${new Date(u.joinedAt).toLocaleString()}</td>`;
      body.appendChild(row);
    });
  } catch (err) {
    errorEl.textContent = 'Could not reach the server.';
  }
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('username');
  window.location.href = 'index.html';
}

loadUsers();
</script>
</body>
</html>
