server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://<ip>:3100/loki/api/v1/push

scrape_configs:
  - job_name: ticketing_access
    static_configs:
      - targets:
          - localhost
        labels:
          job: ticketing_access
          __path__: /var/log/nginx/ticketing-access.log

  - job_name: ticketing_error
    static_configs:
      - targets:
          - localhost
        labels:
          job: ticketing_error
          __path__: /var/log/nginx/ticketing-error.log
